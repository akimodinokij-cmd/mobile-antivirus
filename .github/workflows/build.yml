name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev liblzma-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.33

    - name: Build with Buildozer
      run: |
        buildozer init
        # Настраиваем конфигурацию для Android
        sed -i 's/#title = My Application/title = MiniAntivirus/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = miniantivirus/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.security/' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/#android.permissions =/android.permissions = READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE/' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v2
      with:
        name: package
        path: bin/*.apk
